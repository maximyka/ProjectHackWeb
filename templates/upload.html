<h2>File Upload (Уязвимая загрузка файлов)</h2>

<form method="post" enctype="multipart/form-data">
    <input type="file" name="file">
    <button type="submit">Загрузить</button>
</form>

{% if message %}
<hr>
<p>{{ message }}</p>
<p><a href="{{ url_for('uploaded_file', filename=filename) }}" target="_blank">Открыть файл</a></p>
{% endif %}
